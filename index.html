<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Bank</title>
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Content Bank">
<style>
:root{
  --bg:#14161a; --card:#1d2026; --card2:#252932; --line:#323743;
  --text:#eef0f3; --muted:#9aa1ad; --accent:#f2a93b; --accent-text:#1a1306;
  --light:#5cc8a8; --serious:#e07a6a; --ok:#5cc8a8; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px);max-width:640px;margin:0 auto}
h1{font-size:20px;margin:4px 0 14px;display:flex;align-items:center;justify-content:space-between}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
textarea,input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:84px}
select{appearance:none;-webkit-appearance:none;padding-right:28px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
button,.btn{font:inherit;font-size:15px;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;
  background:var(--card2);color:var(--text);border:1px solid var(--line);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button.small{padding:7px 10px;font-size:13px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{margin-top:10px}
.muted{color:var(--muted);font-size:14px}
.banner{background:#3a2e14;color:#f6d79a;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.idea{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.idea:last-child{border-bottom:0}
.idea .t{white-space:pre-wrap;word-break:break-word}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.tag.Light{color:var(--light);border-color:#2f5f52}
.tag.Serious{color:var(--serious);border-color:#6a3a33}
.tag.status{color:var(--accent);border-color:#5e4520}
.list{padding:0;overflow:hidden}
.empty{padding:16px;color:var(--muted);text-align:center}
.prompt{font-size:19px;line-height:1.35;margin:6px 0 12px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.pick:last-of-type{border-bottom:0}
.pick .body{flex:1;min-width:0}
.note{font-size:13px;color:#f6d79a;margin-top:8px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet.open{display:block}
.sheet .panel{position:absolute;inset:auto 0 0 0;max-height:94vh;overflow:auto;background:var(--bg);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:16px 16px calc(env(safe-area-inset-bottom) + 24px);max-width:640px;margin:0 auto}
.sheet .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .head b{font-size:17px}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);
  background:#eef0f3;color:#14161a;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.hidden{display:none!important}
.danger{color:var(--serious)}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hrow button{text-transform:none;letter-spacing:0}
.series{padding:0;overflow:hidden;margin-bottom:10px}
.shead{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer}
.shead .body{flex:1;min-width:0}
.shead .chev{color:var(--muted);transition:transform .15s;margin-top:2px}
.series.open .chev{transform:rotate(90deg)}
.snotes{font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word}
.sbody{display:none;border-top:1px solid var(--line)}
.series.open .sbody{display:block}
.sadd{display:flex;gap:8px;padding:10px 14px}
.sadd input{flex:1;min-width:0}
</style>
</head>
<body>

<!-- Login -->
<section id="login" class="hidden">
  <h1>Content Bank</h1>
  <div class="card">
    <form id="loginForm">
      <label class="lbl" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" inputmode="email" placeholder="you@example.com">
      <label class="lbl" for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">
      <button class="primary mt" style="width:100%" id="signIn" type="submit">Sign in</button>
      <button class="mt small" id="signUp" type="button">First time? Create account</button>
    </form>
    <p id="loginMsg" class="muted hidden"></p>
  </div>
</section>

<!-- App -->
<main id="app" class="hidden">
  <h1>Content Bank <button class="small" id="stuckBtn">I'm stuck</button></h1>
  <div id="localBanner" class="banner hidden">Not connected to Supabase yet, so ideas only save on this device.</div>

  <div class="card">
    <textarea id="capText" placeholder="New idea..." rows="3"></textarea>
    <div class="grid3">
      <select id="capPillar" aria-label="Pillar"></select>
      <select id="capTone" aria-label="Tone"></select>
      <select id="capSeries" aria-label="Series"></select>
    </div>
    <button class="primary mt" style="width:100%" id="capSave">Save idea</button>
  </div>

  <h2>This week</h2>
  <div class="card" id="weekCard"></div>

  <h2 class="hrow">Series <button class="small" id="newSeries">+ New series</button></h2>
  <div id="seriesList"></div>

  <h2>All ideas</h2>
  <input id="search" type="search" placeholder="Search">
  <div class="grid2 mt">
    <select id="fPillar" aria-label="Filter pillar"></select>
    <select id="fTone" aria-label="Filter tone"></select>
    <select id="fSeries" aria-label="Filter series"></select>
    <select id="fStatus" aria-label="Filter status"></select>
  </div>
  <div class="card list mt" id="list"></div>
  <p class="muted" style="text-align:center;margin-top:24px"><button class="small" id="signOut">Sign out</button></p>
</main>

<!-- Idea detail sheet -->
<div class="sheet" id="ideaSheet">
  <div class="panel">
    <div class="head"><b>Idea</b><button class="small" data-close>Close</button></div>
    <textarea id="dText" rows="3"></textarea>
    <div class="grid2 mt">
      <div><label class="lbl">Pillar</label><select id="dPillar"></select></div>
      <div><label class="lbl">Tone</label><select id="dTone"></select></div>
      <div><label class="lbl">Series</label><select id="dSeries"></select></div>
      <div><label class="lbl">Status</label><select id="dStatus"></select></div>
    </div>

    <h2>Script</h2>
    <p class="muted" style="margin-top:-4px">Copy the prompt, paste it into Claude, then paste the script back here.</p>
    <div class="row">
      <button class="primary" id="copyPrompt">Copy prompt</button>
      <a class="btn" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a>
    </div>
    <label class="lbl">Tweaks (copies a line to paste into the same chat)</label>
    <div class="row">
      <button class="small" data-tweak="funnier">Make it funnier</button>
      <button class="small" data-tweak="drier">Make it drier</button>
      <button class="small" data-tweak="shorter">Shorter</button>
      <button class="small" data-tweak="serious">More serious</button>
    </div>
    <label class="lbl" for="dScript">Your script</label>
    <textarea id="dScript" rows="12" placeholder="Paste or write the script here"></textarea>
    <button class="primary mt" style="width:100%" id="saveScript">Save script</button>
    <p style="text-align:center;margin-top:22px"><button class="small danger" id="deleteIdea">Delete idea</button></p>
  </div>
</div>

<!-- Weekly picker sheet -->
<div class="sheet" id="pickSheet">
  <div class="panel">
    <div class="head"><b>Pick my week</b><button class="small" data-close>Close</button></div>
    <div id="pickList"></div>
    <div id="pickNote" class="note hidden"></div>
    <div class="row mt">
      <button id="repick">Shuffle all</button>
      <button class="primary" id="acceptWeek">Accept week</button>
    </div>
  </div>
</div>

<!-- Series sheet (new or edit) -->
<div class="sheet" id="seriesSheet">
  <div class="panel">
    <div class="head"><b id="seriesSheetTitle">New series</b><button class="small" data-close>Close</button></div>
    <label class="lbl" for="sName">Name</label>
    <input id="sName" placeholder="e.g. Road to 180">
    <label class="lbl" for="sNotes">What the series is about (optional)</label>
    <textarea id="sNotes" rows="4" placeholder="The idea behind the series, the format, how often..."></textarea>
    <button class="primary mt" style="width:100%" id="saveSeries">Save series</button>
    <p style="text-align:center;margin-top:22px"><button class="small danger hidden" id="deleteSeries">Delete series (keeps its ideas)</button></p>
  </div>
</div>

<!-- Stuck sheet -->
<div class="sheet" id="stuckSheet">
  <div class="panel">
    <div class="head"><b>I'm stuck</b><button class="small" data-close>Close</button></div>
    <p class="prompt" id="stuckText"></p>
    <div class="row">
      <button id="stuckNext">Another one</button>
      <button class="primary" id="stuckUse">Use as idea</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
'use strict';

const PILLARS = ['Training in public','Double shift (work + training)','Discipline lessons','Building something'];
const TONES = ['Light','Serious'];
const SERIES = ['Road to 180','Marathon block','6am to 10pm','Learned the hard way','Building it myself','Sunday reset','Untapped Athlete test'];
const STATUSES = ['Idea','Scripted','Filmed','Posted'];
const STUCK = [
  "What's one thing I do that most 21-year-olds don't?",
  "What did this week cost me?",
  "What would I say to a first-year apprentice?",
  "What's a rule I live by, and where did it come from?",
  "What's the most boring part of chasing this goal?",
  "What did I get wrong last month?",
  "What do people assume about me that isn't true?",
  "What am I scared of right now?"
];
const TWEAKS = {
  funnier: 'Make it funnier. Same rules and format.',
  drier:   'Make it drier and more understated. Same rules and format.',
  shorter: 'Make it shorter, closer to 30 seconds. Same rules and format.',
  serious: 'Make it more serious, but keep it calm and plain, never dramatic. Same rules and format.'
};
const TIP = 'Training in public';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

function fillSelect(el, opts, blank){
  el.innerHTML = (blank!==null ? `<option value="">${esc(blank)}</option>` : '') +
    opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
}

function mondayOf(d = new Date()){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay()+6)%7; x.setDate(x.getDate()-day);
  const p = n => String(n).padStart(2,'0');
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`;
}

async function copy(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove(); return ok;
  }
}

/* ---------- Storage: Supabase, or this device only ---------- */
const cfg = window.CB_CONFIG || {};
const useCloud = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase);
const sb = useCloud ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
const LS_KEY = 'cb_ideas_v1';

// One store per table: Supabase when connected, otherwise this browser's localStorage.
function makeStore(table, lsKey, defaults){
  const local = ()=>{ try{ return JSON.parse(localStorage.getItem(lsKey)||'[]'); }catch(e){ return []; } };
  const save = list=>{ try{ localStorage.setItem(lsKey, JSON.stringify(list)); }catch(e){ toast('Could not save on this device'); } };
  return {
    async list(){
      if(!sb) return local();
      const { data, error } = await sb.from(table).select('*');
      if(error) throw error; return data;
    },
    async insert(row){
      if(!sb){
        const now=new Date().toISOString();
        const r={ id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())), ...defaults, created_at:now, updated_at:now, ...row };
        save([...local(), r]); return r;
      }
      const { data, error } = await sb.from(table).insert(row).select().single();
      if(error) throw error; return data;
    },
    async update(id, patch){
      if(!sb){
        const list = local().map(i => i.id===id ? {...i, ...patch, updated_at:new Date().toISOString()} : i);
        save(list); return list.find(i=>i.id===id);
      }
      const { data, error } = await sb.from(table).update(patch).eq('id',id).select().single();
      if(error) throw error; return data;
    },
    async remove(id){
      if(!sb){ save(local().filter(i=>i.id!==id)); return; }
      const { error } = await sb.from(table).delete().eq('id',id);
      if(error) throw error;
    }
  };
}
const store = makeStore('ideas', LS_KEY, { status:'Idea', script:null, week_of:null });
const seriesStore = makeStore('series', 'cb_series_v1', { notes:null });

let ideas = [];
let seriesList = [];   // [{id, name, notes}] in the order they were made
const byNewest = (a,b)=> (b.created_at||'').localeCompare(a.created_at||'');
function setIdea(row){ const i=ideas.findIndex(x=>x.id===row.id); if(i>=0) ideas[i]=row; else ideas.unshift(row); }
function seriesNames(){ return seriesList.map(s=>s.name); }

async function loadSeries(){
  let rows = await seriesStore.list();
  if(!rows.length){
    // First run: start with the built-in series so nothing is lost.
    for(const name of SERIES){ try{ rows.push(await seriesStore.insert({ name })); }catch(e){} }
    if(sb) rows = await seriesStore.list();
  }
  seriesList = rows.sort((a,b)=> (a.created_at||'').localeCompare(b.created_at||''));
}

async function reload(){
  try { ideas = (await store.list()).sort(byNewest); }
  catch(e){ toast('Could not load ideas: '+e.message); }
  try { await loadSeries(); }
  catch(e){ seriesList = SERIES.map(name=>({ id:'builtin-'+name, name })); toast('Could not load series: '+e.message); }
  refreshSeriesSelects();
  render();
}

/* ---------- Rendering ---------- */
function tagsHtml(i){
  return `<div class="tags">
    <span class="tag status">${esc(i.status)}</span>
    ${i.tone?`<span class="tag ${esc(i.tone)}">${esc(i.tone)}</span>`:''}
    ${i.pillar?`<span class="tag">${esc(i.pillar)}</span>`:''}
    ${i.series?`<span class="tag">${esc(i.series)}</span>`:''}
  </div>`;
}

function render(){ renderWeek(); renderSeries(); renderList(); }

/* ---------- Series ---------- */
const OPEN_KEY='cb_open_series';
let openSeries = new Set();
try{ openSeries = new Set(JSON.parse(localStorage.getItem(OPEN_KEY)||'[]')); }catch(e){}
function saveOpen(){ try{ localStorage.setItem(OPEN_KEY, JSON.stringify([...openSeries])); }catch(e){} }

function refreshSeriesSelects(){
  [['capSeries','Series'],['dSeries','None'],['fSeries','All series']].forEach(([id,blank])=>{
    const el=$(id), v=el.value; fillSelect(el, seriesNames(), blank);
    if(v && !seriesNames().includes(v)) el.insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(v)}</option>`);
    el.value=v;
  });
}

function renderSeries(){
  $('seriesList').innerHTML = seriesList.map(s=>{
    const mine = ideas.filter(i=>i.series===s.name);
    const left = mine.filter(i=>i.status!=='Posted').length;
    return `<div class="card series${openSeries.has(s.id)?' open':''}" data-sid="${esc(s.id)}">
      <div class="shead" data-toggle="${esc(s.id)}">
        <span class="chev">›</span>
        <div class="body"><b>${esc(s.name)}</b>
          <span class="muted"> · ${mine.length} idea${mine.length===1?'':'s'}${mine.length&&left!==mine.length?`, ${left} not posted`:''}</span>
          ${s.notes?`<div class="snotes">${esc(s.notes)}</div>`:''}
        </div>
        <button class="small" data-edit-series="${esc(s.id)}">Edit</button>
      </div>
      <div class="sbody">
        ${mine.map(i=>`<div class="idea" data-id="${esc(i.id)}"><div class="t">${esc(i.text)}</div>${tagsHtml(i)}</div>`).join('')}
        <div class="sadd"><input placeholder="New video idea for this series" data-add-input="${esc(s.id)}" enterkeyhint="done"><button class="primary small" data-add="${esc(s.id)}">Add</button></div>
      </div>
    </div>`;
  }).join('') || `<div class="card empty">No series yet.</div>`;
}

async function addToSeries(sid){
  const s = seriesList.find(x=>x.id===sid); const input = document.querySelector(`[data-add-input="${CSS.escape(sid)}"]`);
  const text = input && input.value.trim(); if(!s || !text){ input && input.focus(); return; }
  try{
    setIdea(await store.insert({ text, series:s.name }));
    render(); toast('Added to '+s.name);
    const again = document.querySelector(`[data-add-input="${CSS.escape(sid)}"]`); again && again.focus();
  }catch(e){ toast('Not saved: '+e.message); }
}

let editingSeries = null;
function openSeriesSheet(sid){
  editingSeries = sid ? seriesList.find(s=>s.id===sid) : null;
  $('seriesSheetTitle').textContent = editingSeries ? 'Edit series' : 'New series';
  $('sName').value = editingSeries ? editingSeries.name : '';
  $('sNotes').value = editingSeries ? (editingSeries.notes||'') : '';
  $('deleteSeries').classList.toggle('hidden', !editingSeries);
  openSheet('seriesSheet'); if(!editingSeries) $('sName').focus();
}
$('newSeries').onclick = ()=>openSeriesSheet(null);
$('saveSeries').onclick = async ()=>{
  const name=$('sName').value.trim(), notes=$('sNotes').value.trim()||null;
  if(!name){ $('sName').focus(); return; }
  if(seriesList.some(s=>s.name.toLowerCase()===name.toLowerCase() && s!==editingSeries)){ toast('You already have a series called that'); return; }
  const btn=$('saveSeries'); btn.disabled=true;
  try{
    if(editingSeries){
      const old=editingSeries.name;
      const row=await seriesStore.update(editingSeries.id,{ name, notes });
      seriesList=seriesList.map(s=>s.id===row.id?row:s);
      if(old!==name) for(const i of ideas.filter(i=>i.series===old)) setIdea(await store.update(i.id,{ series:name }));
    } else {
      const row=await seriesStore.insert({ name, notes });
      seriesList.push(row); openSeries.add(row.id); saveOpen();
    }
    refreshSeriesSelects(); render(); closeSheet('seriesSheet'); toast('Series saved');
  }catch(e){ toast('Not saved: '+e.message); }
  btn.disabled=false;
};
$('deleteSeries').onclick = async ()=>{
  const s=editingSeries; if(!s) return;
  const n=ideas.filter(i=>i.series===s.name).length;
  if(!confirm(`Delete the "${s.name}" series?${n?` Its ${n} idea${n===1?'':'s'} stay in All ideas with no series.`:''}`)) return;
  try{
    for(const i of ideas.filter(i=>i.series===s.name)) setIdea(await store.update(i.id,{ series:null }));
    await seriesStore.remove(s.id);
    seriesList=seriesList.filter(x=>x.id!==s.id); openSeries.delete(s.id); saveOpen();
    refreshSeriesSelects(); render(); closeSheet('seriesSheet'); toast('Series deleted');
  }catch(e){ toast('Not deleted: '+e.message); }
};
document.addEventListener('click', e=>{
  const edit=e.target.closest('[data-edit-series]');
  if(edit){ e.stopPropagation(); openSeriesSheet(edit.dataset.editSeries); return; }
  const add=e.target.closest('[data-add]');
  if(add){ addToSeries(add.dataset.add); return; }
  const tog=e.target.closest('[data-toggle]');
  if(tog){
    const id=tog.dataset.toggle; openSeries.has(id)?openSeries.delete(id):openSeries.add(id); saveOpen();
    tog.closest('.series').classList.toggle('open', openSeries.has(id));
  }
});
document.addEventListener('keydown', e=>{
  const inp=e.target.closest && e.target.closest('[data-add-input]');
  if(inp && e.key==='Enter'){ e.preventDefault(); addToSeries(inp.dataset.addInput); }
});

function renderWeek(){
  const wk = mondayOf();
  const mine = ideas.filter(i => i.week_of === wk);
  const card = $('weekCard');
  if(!mine.length){
    card.innerHTML = `<p class="muted" style="margin:0 0 10px">No ideas picked for this week yet.</p>
      <button class="primary" style="width:100%" id="pickBtn">Pick my week</button>`;
  } else {
    card.style.padding='0';
    card.innerHTML = mine.map(i=>`<div class="idea" data-id="${esc(i.id)}"><div class="t">${esc(i.text)}</div>${tagsHtml(i)}</div>`).join('') +
      `<div style="padding:10px 14px"><button class="small" id="pickBtn">Re-pick week</button></div>`;
  }
  if(!mine.length) card.style.padding='';
  $('pickBtn').onclick = openPicker;
}

function renderList(){
  const q = $('search').value.trim().toLowerCase();
  const f = { pillar:$('fPillar').value, tone:$('fTone').value, series:$('fSeries').value, status:$('fStatus').value };
  const rows = ideas.filter(i =>
    (!q || (i.text||'').toLowerCase().includes(q) || (i.script||'').toLowerCase().includes(q)) &&
    (!f.pillar || i.pillar===f.pillar) && (!f.tone || i.tone===f.tone) &&
    (!f.series || i.series===f.series) && (!f.status || i.status===f.status));
  $('list').innerHTML = rows.length
    ? rows.map(i=>`<div class="idea" data-id="${esc(i.id)}"><div class="t">${esc(i.text)}</div>${tagsHtml(i)}</div>`).join('')
    : `<div class="empty">${ideas.length?'Nothing matches those filters.':'No ideas yet. Save your first one above.'}</div>`;
}

/* ---------- Capture ---------- */
async function capture(){
  const text = $('capText').value.trim();
  if(!text){ $('capText').focus(); return; }
  const btn=$('capSave'); btn.disabled=true;
  try{
    const row = await store.insert({ text, pillar:$('capPillar').value||null, tone:$('capTone').value||null, series:$('capSeries').value||null });
    setIdea(row);
    $('capText').value=''; $('capPillar').value=''; $('capTone').value=''; $('capSeries').value='';
    render(); toast('Saved');
  }catch(e){ toast('Not saved: '+e.message); }
  btn.disabled=false;
}

/* ---------- Sheets ---------- */
function openSheet(id){ $(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeSheet(id){ $(id).classList.remove('open'); if(!document.querySelector('.sheet.open')) document.body.style.overflow=''; }
document.querySelectorAll('.sheet').forEach(s=>{
  s.addEventListener('click', e=>{ if(e.target===s || e.target.hasAttribute('data-close')) closeSheet(s.id); });
});

/* ---------- Idea detail ---------- */
let current = null;
function openIdea(id){
  current = ideas.find(i=>i.id===id); if(!current) return;
  $('dText').value=current.text||''; $('dPillar').value=current.pillar||''; $('dTone').value=current.tone||'';
  refreshSeriesSelects();
  if(current.series && !seriesNames().includes(current.series)) $('dSeries').insertAdjacentHTML('beforeend', `<option value="${esc(current.series)}">${esc(current.series)}</option>`);
  $('dSeries').value=current.series||''; $('dStatus').value=current.status||'Idea'; $('dScript').value=current.script||'';
  openSheet('ideaSheet');
}
async function patchCurrent(patch, msg){
  if(!current) return;
  try{ const row = await store.update(current.id, patch); setIdea(row); current=row; render(); if(msg) toast(msg); }
  catch(e){ toast('Not saved: '+e.message); }
}
$('dText').addEventListener('change', ()=>{ const t=$('dText').value.trim(); if(t) patchCurrent({text:t},'Saved'); });
[['dPillar','pillar'],['dTone','tone'],['dSeries','series']].forEach(([el,key])=>{
  $(el).addEventListener('change', ()=>patchCurrent({[key]:$(el).value||null},'Saved'));
});
$('dStatus').addEventListener('change', ()=>patchCurrent({status:$('dStatus').value},'Saved'));
$('saveScript').onclick = async ()=>{
  const patch = { script:$('dScript').value };
  if(current && current.status==='Idea') patch.status='Scripted';
  await patchCurrent(patch, 'Script saved');
  if(current) $('dStatus').value=current.status;
};
$('deleteIdea').onclick = async ()=>{
  if(!current || !confirm('Delete this idea?')) return;
  try{ await store.remove(current.id); ideas=ideas.filter(i=>i.id!==current.id); current=null; closeSheet('ideaSheet'); render(); toast('Deleted'); }
  catch(e){ toast('Not deleted: '+e.message); }
};

let rulesText = null;
async function getRules(){
  if(rulesText) return rulesText;
  const r = await fetch('rules.txt', {cache:'no-cache'});
  if(!r.ok) throw new Error('could not load rules.txt');
  rulesText = (await r.text()).trim(); return rulesText;
}
function buildPrompt(rules, i){
  return `${rules}

---
Idea: ${i.text}
Pillar: ${i.pillar||'not set'}
Tone: ${i.tone||'Light'}
Series: ${i.series||'none'}

Write the script for this idea.`;
}
$('copyPrompt').onclick = async ()=>{
  if(!current) return;
  const text = $('dText').value.trim() || current.text;
  try{
    const ok = await copy(buildPrompt(await getRules(), {...current, text}));
    toast(ok ? 'Prompt copied. Paste it into Claude.' : 'Copy failed');
  }catch(e){ toast('Copy failed: '+e.message); }
};
document.querySelectorAll('[data-tweak]').forEach(b=>{
  b.onclick = async ()=>{ const ok=await copy(TWEAKS[b.dataset.tweak]); toast(ok?'Copied. Paste it into the same chat.':'Copy failed'); };
});

/* ---------- Weekly picker ---------- */
// Rule levels, strictest first. Each later level drops one rule when there aren't enough ideas.
const LEVELS = [
  { tone:true,  tip:true,  series:true,  note:'' },
  { tone:true,  tip:true,  series:false, note:'Not enough ideas to keep it to 1 per series.' },
  { tone:true,  tip:false, series:false, note:'Not enough ideas to keep 1 per series and 2 from Training in public.' },
  { tone:false, tip:false, series:false, note:'Not enough tagged ideas to get 3 light and 1 serious. Tag more ideas with a tone.' }
];
function fits(set, lv){
  let L=0,S=0,tip=0; const seen=new Set();
  for(const i of set){
    if(lv.tone){ if(i.tone==='Light') L++; else if(i.tone==='Serious') S++; else return false; }
    if(i.pillar===TIP) tip++;
    if(lv.series && i.series){ if(seen.has(i.series)) return false; seen.add(i.series); }
  }
  if(lv.tone && (L>3 || S>1)) return false;
  if(lv.tip && tip + (4-set.length) < 2) return false;
  return true;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pool(){ return ideas.filter(i=>i.status!=='Posted'); }
function pickSet(){
  const p = pool();
  for(let li=0; li<LEVELS.length; li++){
    const lv = LEVELS[li];
    for(let t=0; t<300; t++){
      const set=[];
      for(const i of shuffle(p)){ if(fits([...set,i], lv)) set.push(i); if(set.length===4) break; }
      if(set.length===4) return { set, level:li };
    }
  }
  return { set: shuffle(p).slice(0,4), level: LEVELS.length-1 };
}

let picked = [], pickLevel = 0;
function openPicker(){
  if(!pool().length){ toast('No unposted ideas yet'); return; }
  ({ set:picked, level:pickLevel } = pickSet());
  renderPicks(); openSheet('pickSheet');
}
function renderPicks(){
  $('pickList').innerHTML = picked.map((i,n)=>`<div class="pick">
      <div class="body"><div class="t">${esc(i.text)}</div>${tagsHtml(i)}</div>
      <button class="small" data-swap="${n}">Swap</button></div>`).join('');
  let note = LEVELS[pickLevel].note;
  if(picked.length<4) note = `Only ${picked.length} unposted idea${picked.length===1?'':'s'} to pick from.`;
  $('pickNote').textContent = note; $('pickNote').classList.toggle('hidden', !note);
  $('pickList').querySelectorAll('[data-swap]').forEach(b=> b.onclick = ()=>swap(+b.dataset.swap));
}
function swap(n){
  const others = picked.filter((_,k)=>k!==n);
  const ids = new Set(picked.map(i=>i.id));
  const cands = pool().filter(i=>!ids.has(i.id));
  if(!cands.length){ toast('No other ideas to swap in'); return; }
  for(let li=pickLevel; li<LEVELS.length; li++){
    const ok = cands.filter(c=>fits([...others,c], LEVELS[li]));
    if(ok.length){
      picked[n] = ok[Math.floor(Math.random()*ok.length)];
      pickLevel = li; renderPicks(); return;
    }
  }
  picked[n] = cands[Math.floor(Math.random()*cands.length)]; pickLevel = LEVELS.length-1; renderPicks();
}
$('repick').onclick = ()=>{ ({ set:picked, level:pickLevel } = pickSet()); renderPicks(); };
$('acceptWeek').onclick = async ()=>{
  const wk = mondayOf(); const keep = new Set(picked.map(i=>i.id));
  const btn=$('acceptWeek'); btn.disabled=true;
  try{
    for(const i of ideas.filter(i=>i.week_of===wk && !keep.has(i.id))) setIdea(await store.update(i.id,{week_of:null}));
    for(const i of picked) if(i.week_of!==wk) setIdea(await store.update(i.id,{week_of:wk}));
    closeSheet('pickSheet'); render(); toast('Week locked in');
  }catch(e){ toast('Not saved: '+e.message); }
  btn.disabled=false;
};

/* ---------- Stuck ---------- */
let lastStuck=-1;
function nextStuck(){ let n; do{ n=Math.floor(Math.random()*STUCK.length); }while(n===lastStuck && STUCK.length>1); lastStuck=n; $('stuckText').textContent=STUCK[n]; }
$('stuckBtn').onclick = ()=>{ nextStuck(); openSheet('stuckSheet'); };
$('stuckNext').onclick = nextStuck;
$('stuckUse').onclick = ()=>{ $('capText').value = STUCK[lastStuck]+'\n'; closeSheet('stuckSheet'); $('capText').focus(); };

/* ---------- Wiring ---------- */
fillSelect($('capPillar'), PILLARS, 'Pillar'); fillSelect($('capTone'), TONES, 'Tone'); fillSelect($('capSeries'), SERIES, 'Series');
fillSelect($('dPillar'), PILLARS, 'Not set'); fillSelect($('dTone'), TONES, 'Not set'); fillSelect($('dSeries'), SERIES, 'None'); fillSelect($('dStatus'), STATUSES, null);
fillSelect($('fPillar'), PILLARS, 'All pillars'); fillSelect($('fTone'), TONES, 'All tones'); fillSelect($('fSeries'), SERIES, 'All series'); fillSelect($('fStatus'), STATUSES, 'All statuses');
['search','fPillar','fTone','fSeries','fStatus'].forEach(id=>$(id).addEventListener('input', renderList));
$('capSave').onclick = capture;
$('capText').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)) capture(); });
document.addEventListener('click', e=>{ const el=e.target.closest('.idea[data-id]'); if(el) openIdea(el.dataset.id); });

/* ---------- Login ---------- */
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); reload(); }
function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); }
function loginMsg(t){ $('loginMsg').textContent=t; $('loginMsg').classList.toggle('hidden', !t); }
$('loginForm').onsubmit = async e=>{
  e.preventDefault();
  const email=$('email').value.trim(), password=$('password').value;
  if(!email || !password) return;
  $('signIn').disabled=true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('signIn').disabled=false;
  if(error){ loginMsg(error.message); return; }
  loginMsg(''); showApp();
};
$('signUp').onclick = async ()=>{
  const email=$('email').value.trim(), password=$('password').value;
  if(!email || password.length<8){ loginMsg('Enter your email and a password of at least 8 characters.'); return; }
  $('signUp').disabled=true;
  const { data, error } = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + location.pathname } });
  $('signUp').disabled=false;
  if(error){ loginMsg(error.message); return; }
  if(data.session){ loginMsg(''); showApp(); }
  else loginMsg('Account created. Tap the confirm link in your email (any browser is fine), then come back here and sign in.');
};
$('signOut').onclick = async ()=>{ if(sb){ await sb.auth.signOut(); ideas=[]; showLogin(); } else toast('Not signed in (this device only)'); };

if(!sb){ $('localBanner').classList.remove('hidden'); $('signOut').classList.add('hidden'); showApp(); }
else {
  sb.auth.getSession().then(({data})=> data.session ? showApp() : showLogin());
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') showLogin(); });
}

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
})();
